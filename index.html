<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kazik - Fixed & Improved</title>
<style>
  * {margin:0;padding:0;box-sizing:border-box; user-select:none;}
  body {background:#0b1020; font-family:Arial,sans-serif; color:#fff; min-height:100vh;}
  /* Общие стили */
  .screen {display:none; padding:20px; max-width:800px; margin:auto; border-radius:10px; background:#222; min-height:400px; position:relative;}
  .screen.active {display:flex; flex-direction:column;}
  /* Заголовки и кнопки */
  .top-bar {display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;}
  .btn {padding:10px 20px; border:none; border-radius:8px; background:#4fc3f7; cursor:pointer; font-weight:600; transition:background 0.3s;}
  .btn:hover {background:#66ccf7;}
  /* Вкладки */
  .tabs {display:flex; gap:10px; margin-bottom:15px;}
  .tab {flex:1; padding:10px; background:#3d2d70; border-radius:8px; cursor:pointer; text-align:center;}
  .tab.active {background:#4fc3f7; color:#000;}
  /* Контент вкладок */
  .tab-contents {display:none; flex-direction:column; gap:10px;}
  .tab-contents.active {display:flex;}
  /* Игра - области */
  #gameArea { flex:1; display:flex; align-items:center; justify-content:center; font-size:24px; color:#ffd54f; border:2px solid #555; border-radius:10px; padding:20px; min-height:200px;}
  /* Crash */
  #crashStage { position: relative; width:100%; height:300px; overflow:hidden; border:2px solid #555; border-radius:10px; background:#111; margin-top:20px; }
  #crashRocket { position:absolute; top:calc(50% - 20px); left:10%; font-size:40px; transition: all 0.5s ease; transform: rotate(45deg);}
  #crashLine { position:absolute; bottom:50px; left:0; height:2px; background:#ffd54f; width:0%; transition: width 0.5s ease;}
  /* Dice */
  #diceStage { margin-top:20px; display:flex; flex-direction:column; align-items:center; }
  .dice { margin:10px; width:80px; height:80px; border-radius:10px; border:2px solid #555; display:flex; align-items:center; justify-content:center; font-size:36px; background:#222; }
  /* Slots */
  #slotsArea { margin-top:20px; display:flex; flex-direction:column; align-items:center; }
  #reels { display:flex; gap:10px; }
  .reel { width:60px; height:60px; border:2px solid #555; border-radius:8px; background:#111; display:flex; align-items:center; justify-content:center; font-size:24px; }
  #slotResult { margin-top:10px; font-size:32px; transition: all 0.2s; }
</style>
</head>
<body>

<!-- меню -->
<div id="mainMenu" class="screen active">
  <h1 style="text-align:center;margin-bottom:20px;">🎰 Kazik</h1>
  <div class="tabs">
    <div class="tab active" data-tab="games">Games</div>
    <div class="tab" data-tab="online">Online</div>
    <div class="tab" data-tab="stats">Session Score</div>
  </div>
  <div class="tab-contents">
    <div class="tab-content active" id="games">
      <button class="btn" data-game="lucky">20 Cells</button>
      <button class="btn" id="blackjackBtn">Blackjack</button>
      <button class="btn" data-game="dice">Dice</button>
      <button class="btn" data-game="crash">Crash</button>
      <button class="btn" data-game="mines">Mines</button>
      <button class="btn" data-game="slots">Slots</button>
      <button class="btn" data-game="roulette">Roulette</button>
    </div>
    <div class="tab-content" id="online">
      <h3 style="text-align:center;">Coming Soon</h3>
    </div>
    <div class="tab-content" id="stats">
      <div id="sessionStats" style="margin-top:20px; font-size:14px; text-align:center;">Statistics will be here</div>
      <button class="btn" id="backToMainStats">Back</button>
    </div>
  </div>
</div>

<!-- Игра -->
<div id="gameWindow" class="screen">
  <div class="top-bar">
    <button class="btn" id="toMainFromGame">◀ Back</button>
    <h2>Game</h2>
  </div>
  <div id="gameArea"></div>
</div>

<!-- Статистика -->
<div id="sessionStatsWindow" class="screen">
  <div class="top-bar">
    <button class="btn" id="toMainFromStats">◀ Back</button>
    <h2>Session Stats</h2>
  </div>
  <div id="sessionStatsContent" style="margin-top:20px;">Statistics</div>
</div>

<!-- Crash -->
<div id="crashWindow" class="screen">
  <div class="top-bar">
    <button class="btn" id="toMainFromCrash">◀ Back</button>
    <h2>Crash</h2>
  </div>
  <div id="crashStage">
    <div id="crashLine"></div>
    <div id="crashRocket">🚀</div>
  </div>
  <div style="margin-top:20px; text-align:center;">
    <button class="btn" id="startRocket">Launch Rocket</button>
    <button class="btn" id="cashoutBtn" style="display:none;">Cash Out</button>
  </div>
  <div id="crashMsg" style="margin-top:10px; text-align:center; font-size:14px;"></div>
</div>

<!-- Dice -->
<div id="diceWindow" class="screen">
  <div class="top-bar">
    <button class="btn" id="toMainFromDice">◀ Back</button>
    <h2>Dice</h2>
  </div>
  <div id="diceStage" style="margin-top:20px;">
    <div class="dice" id="dice1">🎲</div>
    <div class="dice" id="dice2">🎲</div>
    <button class="btn" id="rollDice">Roll Dice</button>
  </div>
</div>

<!-- Slots -->
<div id="slotsWindow" class="screen">
  <div class="top-bar">
    <button class="btn" id="toMainFromSlots">◀ Back</button>
    <h2>Slots</h2>
  </div>
  <div id="slotsArea" style="margin-top:20px;">
    <div style="display:flex; gap:10px;">
      <div class="reel" id="reel1">🍒</div>
      <div class="reel" id="reel2">🍒</div>
      <div class="reel" id="reel3">🍒</div>
    </div>
    <div id="slotResult"></div>
    <button class="btn" id="spinSlots" style="margin-top:20px;">Spin</button>
  </div>
</div>

<script>
  // Переключение вкладок
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.tab-contents').forEach(c => c.classList.remove('active'));
      document.querySelector('#' + t.dataset.tab).classList.add('active');
    }
  });

  // Переключение экранов
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Обработка выбора игр
  document.querySelectorAll('.btn[data-game]').forEach(btn => {
    btn.onclick = () => {
      showScreen('gameWindow');
      startGame(btn.dataset.game);
    }
  });

  // Обратные кнопки
  document.getElementById('toMainFromGame').onclick = () => showScreen('mainMenu');
  document.getElementById('toMainFromStats').onclick = () => showScreen('mainMenu');
  document.getElementById('toMainFromCrash').onclick = () => showScreen('mainMenu');
  document.getElementById('toMainFromDice').onclick = () => showScreen('mainMenu');
  document.getElementById('toMainFromSlots').onclick = () => showScreen('mainMenu');

  // Статистика
  let sessionStats = {lucky:0, bj:0, roulette:0};
  function updateStats() {
    document.getElementById('sessionStats').innerHTML =
      '20 Cells Wins: ' + sessionStats.lucky + '<br>' +
      'Blackjack Wins: ' + sessionStats.bj + '<br>' +
      'Roulette Wins: ' + sessionStats.roulette;
  }

  document.getElementById('backToMainStats').onclick = () => showScreen('mainMenu');

  // ------------ Реализация игр -------------------

function startGame(game) {
  const area = document.getElementById('gameArea');
  area.innerHTML = '';
  if (game==='lucky') {
    area.innerHTML = '<h3>20 Cells: Find the diamond</h3><button id="luckyBtn">Start</button>';
    document.getElementById('luckyBtn').onclick = runLucky;
  } else if (game==='bj') {
    // Описание о баге
    area.innerHTML = '<h3>Blackjack</h3><p style="color:#888; text-decoration:line-through;">Coming Soon. We are fixing bugs and will update soon.</p>';
    alert('This game has bugs and is under development. It will be updated or replaced soon.');
  } else if (game==='dice') {
    area.innerHTML = '<h3>Dice</h3><button id="diceBtn">Roll the Dice</button>';
    document.getElementById('diceBtn').onclick=runDice;
  } else if (game==='crash') {
    showScreen('crashWindow');
    initCrash();
  } else if (game==='mines') {
    area.innerHTML = '<h3>Mines</h3><p>Game in development</p>';
  } else if (game==='slots') {
    showScreen('slotsWindow');
    initSlots();
  } else if (game==='roulette') {
    area.innerHTML = '<h3>Roulette</h3><p>Game in development</p>';
  }
}

// -------- Lucky game --------
function runLucky() {
  const area = document.getElementById('gameArea');
  area.innerHTML = '';
  const container = document.createElement('div');
  container.innerHTML = '<div style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px;">' +
    Array.from({length:20}, (_,i) => `<div style="border:1px solid #555; padding:10px; cursor:pointer;" data-i="${i}">?</div>`).join('') +
    '</div>';
  area.appendChild(container);
  const cells = container.querySelectorAll('div[data-i]');
  const winIndex = Math.floor(Math.random()*20);
  let tries=3;
  cells.forEach(c => {
    c.onclick=()=>{
      const idx = parseInt(c.dataset.i);
      if (tries===0) return;
      if (idx===winIndex) {
        c.textContent='💎';
        alert('You won!');
        sessionStats.lucky++;
        updateStats();
      } else {
        c.textContent='✖';
        tries--;
        if (tries===0) {
          cells[winIndex].textContent='💎';
          alert('You lost! It was at '+winIndex);
        }
      }
    }
  });
}

// -------- Blackjack --------
function runBlackjack() {
  const area = document.getElementById('gameArea');
  area.innerHTML = '<p>Blackjack is under development, stay tuned!</p>';
}

// -------- Dice --------
function runDice() {
  const area = document.getElementById('gameArea');
  area.innerHTML = '<div id="diceContainer" style="text-align:center;">' +
    '<div style="display:flex; gap:20px; justify-content:center;">' +
    '<div class="dice" id="dice1">🎲</div>' +
    '<div class="dice" id="dice2">🎲</div>' +
    '</div>' +
    '<button class="btn" id="rollDice">Roll Dice</button>' +
    '</div>';
  document.getElementById('rollDice').onclick=rollDiceAnimation;
}

function rollDiceAnimation() {
  const d1 = document.getElementById('dice1');
  const d2 = document.getElementById('dice2');
  const diceFaces=['🎲','🎲','🎲','🎲','🎲','🎲'];
  let count=0;
  const maxCount=30; // дольше
  const interval = setInterval(()=>{
    d1.textContent=diceFaces[Math.floor(Math.random()*diceFaces.length)];
    d2.textContent=diceFaces[Math.floor(Math.random()*diceFaces.length)];
    count++;
    if (count>=maxCount) {
      clearInterval(interval);
      // конечный результат
      d1.textContent=['🎲','🎲','🎲'][Math.floor(Math.random()*3)];
      d2.textContent=['🎲','🎲','🎲'][Math.floor(Math.random()*3)];
      // звук
      new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3').play();
    }
  }, 150);
}

// -------- Crash --------
let crashInterval;
function initCrash() {
  const rocket = document.getElementById('crashRocket');
  const line = document.getElementById('crashLine');
  line.style.width='0%';
  rocket.style.left='10%';
  rocket.style.top='calc(50% - 20px)';
  rocket.style.transform='rotate(45deg)';
  document.getElementById('crashMsg').textContent='';
  document.getElementById('cashoutBtn').style.display='none';

  document.getElementById('startRocket').onclick=()=>{
    line.style.width='0%';
    let progress=0;
    clearInterval(crashInterval);
    crashInterval=setInterval(()=>{
      progress+=0.3+Math.random()*0.2; // медленнее
      if (progress>100) progress=100;
      line.style.width=progress+'%';

      // ракета движется
      rocket.style.left=progress+'%';
      // поворот
      rocket.style.transform='rotate(45deg)';
      if (progress>=100) {
        clearInterval(crashInterval);
        document.getElementById('crashMsg').textContent='💥 Crash at ×'+(1+progress/100).toFixed(2);
        document.getElementById('cashoutBtn').style.display='inline-block';
      }
    }, 300); // медленнее
  };
  document.getElementById('cashoutBtn').onclick=()=>{
    alert('You cashed out!');
    showScreen('mainMenu');
  };
}

// -------- Slots --------
function initSlots() {
  document.getElementById('spinSlots').onclick=()=>{
    const faces=['🍒','🍋','🍇','⭐','💎','7️⃣'];
    const reel1=document.getElementById('reel1');
    const reel2=document.getElementById('reel2');
    const reel3=document.getElementById('reel3');

    // Анимация прокрутки с звуком
    animateReel(reel1, faces);
    animateReel(reel2, faces);
    animateReel(reel3, faces, true); // с эффектом

    // Итог
    setTimeout(()=>{
      const final1=faces[Math.floor(Math.random()*faces.length)];
      const final2=faces[Math.floor(Math.random()*faces.length)];
      const final3=faces[Math.floor(Math.random()*faces.length)];
      reel1.textContent=final1;
      reel2.textContent=final2;
      reel3.textContent=final3;

      // выигрыш или проигрыш
      if (final1===final2 && final2===final3) {
        let payout=0;
        if (final1==='💎') payout=25;
        else if (final1==='⭐') payout=15;
        else if (final1==='7️⃣') payout=12;
        else if (final1==='🍒') payout=10;
        else if (final1==='🍋') payout=8;
        else payout=6;
        document.getElementById('slotResult').textContent='Win x'+payout+'!';
      } else if (final1===final2 || final2===final3 || final1===final3) {
        document.getElementById('slotResult').textContent='Pair x2!';
      } else {
        document.getElementById('slotResult').textContent='Lose!';
      }
      // звук
      new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3').play();
    }, 3000); // дольше
  };
}

function animateReel(reel, faces, fast=false) {
  let count=0;
  const maxCount=30; // дольше
  const intervalTime=fast ? 50 : 100;
  const interval=setInterval(()=>{
    reel.textContent=faces[Math.floor(Math.random()*faces.length)];
    count++;
    if (count>=maxCount) {
      clearInterval(interval);
    }
  }, intervalTime);
}

// --------- Инициализация ---------
updateStats();

</script>
</body>
</html>
