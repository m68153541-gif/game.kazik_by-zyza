<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Golden Palace</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --accent:#d4af37;
  --accent-dim:rgba(212,175,55,.3);
  --accent-glow:rgba(212,175,55,.6);
  --shape:22px 10px 22px 10px;
  --bg-menu:linear-gradient(180deg,#0a0a14 0%,#1a1035 50%,#0a0a14 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100vh;height:100dvh;background:#0a0a14;overflow:hidden}
body{font-family:'Segoe UI',Arial,sans-serif;user-select:none;color:#fff;position:relative}

.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:orbFloat 22s ease-in-out infinite}
.bg-orbs .orb.o1{width:340px;height:340px;background:var(--accent);top:-100px;left:-100px}
.bg-orbs .orb.o2{width:300px;height:300px;background:#10b981;bottom:-90px;right:-80px;animation-delay:-8s}
.bg-orbs .orb.o3{width:260px;height:260px;background:#a855f7;top:40%;right:-110px;animation-delay:-14s;opacity:.35}
.bg-orbs .orb.o4{width:220px;height:220px;background:#f59e0b;bottom:25%;left:-90px;animation-delay:-5s;opacity:.3}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-50px) scale(1.15)}66%{transform:translate(-40px,40px) scale(.9)}}

.bg-words{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg-words span{position:absolute;font-weight:900;font-style:italic;letter-spacing:-4px;opacity:.05;white-space:nowrap;animation:bgTextFloat 20s ease-in-out infinite;font-family:Arial,sans-serif;text-transform:uppercase;line-height:1}
.bg-words span:nth-child(1){top:3%;left:-10%;transform:rotate(-12deg);font-size:min(240px,52vw)}
.bg-words span:nth-child(2){top:32%;right:-12%;transform:rotate(18deg);font-size:min(220px,48vw);animation-delay:-5s}
.bg-words span:nth-child(3){bottom:20%;left:-12%;transform:rotate(-8deg);font-size:min(200px,44vw);animation-delay:-10s}
.bg-words span:nth-child(4){bottom:-5%;right:-8%;transform:rotate(22deg);font-size:min(230px,50vw);animation-delay:-15s}
@keyframes bgTextFloat{0%,100%{opacity:.04;transform:rotate(var(--rot,0deg)) scale(1)}50%{opacity:.09;transform:rotate(var(--rot,0deg)) scale(1.05)}}
.bg-words.menu span{color:var(--accent)}
.bg-words.online span{color:#10b981}
.bg-words.settings span{color:#a855f7}
.bg-words.admin span{color:#ff5252}
.bg-words.games span{color:#22d3ee}
.bg-words.about span{color:#f59e0b}
.bg-words.shop span{color:#ffd700}

#loader{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 30%,#1a1432 0%,#0a0a14 60%,#05050a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;transition:opacity .9s ease,visibility .9s ease}
#loader.hide{opacity:0;visibility:hidden}
.loader-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.loader-stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:starTwinkle 3s ease-in-out infinite}
@keyframes starTwinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.5)}}
.loader-core{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center}
.loader-ring-outer{position:absolute;width:170px;height:170px;border-radius:50%;border:2px dashed var(--accent-dim);animation:ringSpinCW 12s linear infinite}
.loader-ring-inner{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px dotted rgba(16,185,129,.5);animation:ringSpinCCW 8s linear infinite}
@keyframes ringSpinCW{to{transform:rotate(360deg)}}
@keyframes ringSpinCCW{to{transform:rotate(-360deg)}}
.loader-dots{position:absolute;width:190px;height:190px;pointer-events:none}
.loader-dots span{position:absolute;width:8px;height:8px;border-radius:50%}
.loader-dots span:nth-child(1){top:0;left:50%;transform:translateX(-50%);background:var(--accent);box-shadow:0 0 14px var(--accent);animation:dotPulseX 1.8s ease-in-out infinite}
.loader-dots span:nth-child(2){bottom:0;left:50%;transform:translateX(-50%);background:#10b981;box-shadow:0 0 14px #10b981;animation:dotPulseX 1.8s ease-in-out infinite .3s}
.loader-dots span:nth-child(3){left:0;top:50%;background:#a855f7;box-shadow:0 0 14px #a855f7;animation:dotPulseY 1.8s ease-in-out infinite .6s}
.loader-dots span:nth-child(4){right:0;top:50%;background:#f59e0b;box-shadow:0 0 14px #f59e0b;animation:dotPulseY 1.8s ease-in-out infinite .9s}
@keyframes dotPulseX{0%,100%{opacity:.3;transform:translateX(-50%) scale(.7)}50%{opacity:1;transform:translateX(-50%) scale(1.5)}}
@keyframes dotPulseY{0%,100%{opacity:.3;transform:translateY(-50%) scale(.7)}50%{opacity:1;transform:translateY(-50%) scale(1.5)}}
.loader-orbit{position:absolute;border:2px solid transparent;border-radius:50%;animation:orbitSpin linear infinite}
.loader-orbit.o1{width:80%;height:80%;border-top-color:var(--accent);border-right-color:var(--accent);animation-duration:3.5s}
.loader-orbit.o2{width:60%;height:60%;border-bottom-color:#10b981;border-left-color:#10b981;animation-duration:4.5s;animation-direction:reverse}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
.core-pulse{position:absolute;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd700,#f59e0b);box-shadow:0 0 55px var(--accent-glow);animation:corePulseAnim 1.4s ease-in-out infinite alternate}
@keyframes corePulseAnim{from{transform:scale(.85)}to{transform:scale(1.2)}}
.core-text{position:absolute;font-size:36px;filter:drop-shadow(0 0 14px var(--accent-glow));animation:coreSpin 4s linear infinite;z-index:2}
@keyframes coreSpin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
.loader-logo{font-size:min(38px,9vw);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#ffd700,var(--accent),#f59e0b,#ffd700);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoShift 3s linear infinite;text-align:center;padding:0 16px;max-width:90vw;z-index:2;filter:drop-shadow(0 0 20px var(--accent-dim))}
@keyframes logoShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.loader-tips{font-size:11px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;min-height:14px;text-align:center;z-index:2;opacity:.8}
.loader-bar-wrap{width:min(70vw,300px);height:4px;background:#1a1432;border-radius:20px;overflow:hidden;border:1px solid #3d2d70;z-index:2}
.loader-bar{height:100%;width:0%;background:linear-gradient(90deg,#ffd700,var(--accent),#10b981);background-size:200% 100%;border-radius:20px;animation:barShine 1.2s linear infinite;transition:width .3s ease}
@keyframes barShine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.loader-percent{font-size:12px;font-weight:bold;color:var(--accent);letter-spacing:2px;z-index:2}

.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow:hidden;height:100%;z-index:1}
.screen.active{display:flex;animation:screenIn .5s cubic-bezier(.2,.7,.3,1.2) both}
@keyframes screenIn{0%{opacity:0;transform:translateY(30px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}

#menu{padding:0;overflow:hidden;background:var(--bg-menu);position:relative}
.menu-header{padding:16px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:2}
.gp-title-wrap{display:flex;align-items:center;justify-content:center;gap:10px;position:relative}
.gp-title{font-size:min(32px,8.5vw);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#ffd700,var(--accent),#f59e0b,#ffd700);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoShift 4s linear infinite;text-align:center;filter:drop-shadow(0 0 25px var(--accent-dim))}
.gp-crown{font-size:22px;display:inline-block;animation:crownSpin 6s linear infinite}
@keyframes crownSpin{0%,88%{transform:rotate(0) scale(1)}92%{transform:rotate(15deg) scale(1.15)}96%{transform:rotate(-10deg) scale(1.1)}100%{transform:rotate(0) scale(1)}}
.gp-subtitle{font-size:9px;color:var(--accent);letter-spacing:6px;text-transform:uppercase;opacity:.7;margin-top:-2px;text-align:center}

.player-info-card{width:100%;max-width:440px;background:linear-gradient(145deg,rgba(30,20,60,.85),rgba(20,12,44,.85));border:2px solid var(--accent);border-radius:var(--shape);padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;box-shadow:0 0 35px var(--accent-dim),inset 0 0 30px var(--accent-dim);position:relative;overflow:hidden;margin-top:4px}
.player-info-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent 0%,var(--accent-dim) 25%,transparent 50%,rgba(16,185,129,.1) 75%,transparent 100%);animation:bgRotate 18s linear infinite;pointer-events:none}
.player-info-card::after{content:'';position:absolute;top:6px;left:6px;right:6px;bottom:6px;border:1px solid var(--accent-dim);border-radius:var(--shape);pointer-events:none}
@keyframes bgRotate{to{transform:rotate(360deg)}}
.pi-item{display:flex;align-items:center;gap:6px;font-size:12px;position:relative;z-index:1}
.pi-item .pi-ico{font-size:14px;filter:drop-shadow(0 0 4px var(--accent-glow))}
.pi-item .pi-lbl{color:#a78bfa;font-weight:normal;font-size:11px}
.pi-item .pi-val{color:#fff;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-balance{color:var(--accent) !important;font-weight:900 !important;font-size:14px !important;grid-column:1/-1;justify-content:center;padding-top:6px;border-top:1px solid var(--accent-dim);margin-top:4px;letter-spacing:1px}
.pi-timer{color:#10b981 !important;font-family:monospace;letter-spacing:1px}
.pi-status{color:#10b981 !important;font-weight:bold}

.tabs{display:flex;gap:8px;padding:10px 12px;flex-shrink:0;max-width:480px;width:100%;margin:0 auto;position:relative;z-index:2}
.tab-btn{flex:1;padding:12px 6px;background:linear-gradient(145deg,rgba(30,20,60,.85),rgba(20,12,44,.85));border:2px solid #3d2d70;border-radius:var(--shape);color:#a78bfa;font-size:11px;font-weight:bold;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.tab-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,var(--accent-dim) 100%);opacity:0;transition:opacity .3s}
.tab-btn.active{background:linear-gradient(145deg,var(--accent-dim),rgba(16,185,129,.2));border-color:var(--accent);color:#fff;box-shadow:0 0 25px var(--accent-glow),inset 0 0 15px var(--accent-dim);transform:translateY(-2px)}
.tab-btn.active::before{opacity:1}
.tab-btn .tab-ico{font-size:20px;filter:drop-shadow(0 0 6px currentColor);transition:transform .3s}
.tab-btn.active .tab-ico{transform:scale(1.15)}
.tab-btn .tab-lbl{font-size:10px;letter-spacing:.5px}
.tab-content{flex:1;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 30px;height:0;min-height:0;position:relative;z-index:1}
.tab-content.active{display:block}

.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:440px;margin:0 auto;padding-bottom:20px}
.game-tile{background:linear-gradient(145deg,rgba(30,20,60,.95),rgba(20,12,44,.95));border:2px solid #3d2d70;border-radius:var(--shape);padding:20px 12px;cursor:pointer;text-align:center;transition:all .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.game-tile::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--accent-dim),transparent 70%);opacity:0;transition:opacity .35s}
.game-tile:active{transform:scale(.94) rotate(-1deg);border-color:var(--accent);box-shadow:0 0 40px var(--accent-glow)}
.game-tile:active::before{opacity:1}
.game-tile .g-ico{font-size:44px;filter:drop-shadow(0 0 10px var(--accent-dim));transition:transform .35s;z-index:1}
.game-tile:active .g-ico{transform:scale(1.1) rotate(5deg)}
.game-tile .g-name{font-size:14px;font-weight:900;color:#fff;z-index:1;letter-spacing:.5px}
.game-tile .g-desc{font-size:10px;color:#a78bfa;z-index:1}
.game-tile .g-badge{position:absolute;top:6px;right:6px;font-size:9px;padding:3px 9px;border-radius:10px;background:#10b981;color:#fff;font-weight:900;letter-spacing:1.5px;box-shadow:0 0 14px rgba(16,185,129,.8);animation:newBadgePulse 1.6s ease-in-out infinite alternate;z-index:2}
@keyframes newBadgePulse{from{box-shadow:0 0 10px rgba(16,185,129,.5)}to{box-shadow:0 0 22px rgba(16,185,129,1)}}
.game-tile.disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
.game-tile.disabled::after{content:'';position:absolute;top:50%;left:8%;right:8%;height:3px;background:#ff5252;transform:rotate(-8deg);z-index:3;border-radius:2px;box-shadow:0 0 12px #ff5252;pointer-events:none}
.game-tile.disabled .g-badge{background:#ff5252;box-shadow:0 0 10px rgba(255,82,82,.6)}

.list-btn{display:flex;align-items:center;gap:14px;width:100%;max-width:440px;margin:0 auto 10px;padding:16px 18px;background:linear-gradient(145deg,rgba(30,20,60,.95),rgba(20,12,44,.95));border:2px solid #3d2d70;border-radius:var(--shape);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:all .3s}
.list-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#ffd700,var(--accent));transition:width .3s}
.list-btn:active{transform:scale(.97);border-color:var(--accent);box-shadow:0 0 25px var(--accent-dim)}
.list-btn:active::before{width:8px}
.list-btn .lb-ico{font-size:26px;filter:drop-shadow(0 0 6px var(--accent-dim))}
.list-btn .lb-info{flex:1;text-align:left}
.list-btn .lb-info .lb-n{font-size:15px}
.list-btn .lb-info .lb-d{font-size:11px;color:#a78bfa;font-weight:normal;margin-top:2px}
.list-btn .lb-arrow{color:var(--accent);font-size:22px;transition:transform .3s}

/* ONLINE */
.online-hub{padding:14px 16px 30px;max-width:480px;margin:0 auto;position:relative;z-index:2}
.online-hero{background:linear-gradient(145deg,var(--accent-dim),rgba(16,185,129,.1));border:2px solid var(--accent);border-radius:var(--shape);padding:22px 20px;text-align:center;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:0 0 35px var(--accent-dim)}
.online-hero::before{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,var(--accent-dim),transparent 30%,rgba(16,185,129,.15),transparent 60%);animation:bgRotate 14s linear infinite;pointer-events:none}
.online-hero h2{font-size:22px;font-weight:900;background:linear-gradient(90deg,#ffd700,#10b981,#ffd700);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoShift 3s linear infinite;position:relative;z-index:1}
.online-hero .oh-badge{display:inline-block;font-size:10px;background:linear-gradient(145deg,var(--accent),#f59e0b);color:#0a0a14;padding:4px 14px;border-radius:12px;font-weight:900;letter-spacing:2px;margin-top:8px;position:relative;z-index:1}
.online-hero p{font-size:12px;color:#cbd5e1;line-height:1.6;margin-top:8px;position:relative;z-index:1}
.online-actions{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;position:relative;z-index:1}
.online-action-btn{width:100%;padding:18px 20px;background:linear-gradient(145deg,rgba(30,20,60,.95),rgba(20,12,44,.95));border:2px solid #3d2d70;border-radius:var(--shape);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:14px;transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.online-action-btn:active{transform:scale(.97);border-color:var(--accent);box-shadow:0 0 25px var(--accent-glow)}
.online-action-btn .oab-ico{font-size:32px;filter:drop-shadow(0 0 10px var(--accent-dim))}
.online-action-btn .oab-info{flex:1;text-align:left}
.online-action-btn .oab-info .oab-n{font-size:15px}
.online-action-btn .oab-info .oab-d{font-size:11px;color:#a78bfa;font-weight:normal;margin-top:3px}
.online-action-btn.create{border-color:rgba(16,185,129,.5)}
.online-action-btn.create .oab-ico{filter:drop-shadow(0 0 10px rgba(16,185,129,.6))}
.online-action-btn.join{border-color:rgba(168,85,247,.5)}
.online-action-btn.shop{border-color:rgba(255,215,0,.5)}

.online-info-card{background:linear-gradient(145deg,rgba(30,20,60,.9),rgba(20,12,44,.9));border:2px solid #3d2d70;border-radius:var(--shape);padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden;z-index:1}
.online-info-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#ffd700,var(--accent))}
.online-info-card h3{font-size:13px;color:var(--accent);font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.online-info-card h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--accent-dim),transparent)}
.online-info-card .oi-content{font-size:12px;color:#cbd5e1;line-height:1.7}
.online-info-card .oi-empty{color:#a78bfa;font-style:italic;font-size:11px;text-align:center;padding:8px;border:1px dashed rgba(167,139,250,.3);border-radius:10px;background:rgba(167,139,250,.03)}

.dev-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.dev-row:last-child{border-bottom:none}
.dev-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#ffd700,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 0 15px var(--accent-glow),inset -3px -3px 8px rgba(0,0,0,.3),inset 2px 2px 6px rgba(255,255,255,.3)}
.dev-avatar.dev2{background:linear-gradient(145deg,#10b981,#0891b2);box-shadow:0 0 15px rgba(16,185,129,.6),inset -3px -3px 8px rgba(0,0,0,.3),inset 2px 2px 6px rgba(255,255,255,.3)}
.dev-info{flex:1;text-align:left}
.dev-info .dev-name{font-size:15px;font-weight:900;color:#fff}
.dev-info .dev-role{font-size:10px;color:#a78bfa;margin-top:3px;text-transform:uppercase;letter-spacing:1px}
.dev-info .dev-id{font-size:11px;color:var(--accent);font-family:monospace;letter-spacing:2px;margin-top:3px;font-weight:bold}

/* SHOP */
.shop-cats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;max-width:480px;margin:0 auto;position:relative;z-index:2}
.shop-cat{flex-shrink:0;padding:10px 18px;background:linear-gradient(145deg,rgba(30,20,60,.9),rgba(20,12,44,.9));border:2px solid #3d2d70;border-radius:24px;color:#a78bfa;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .3s;letter-spacing:.5px}
.shop-cat.active{border-color:var(--accent);color:#fff;background:linear-gradient(145deg,var(--accent-dim),rgba(16,185,129,.15));box-shadow:0 0 20px var(--accent-glow)}
.shop-items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:0 auto;padding:0 16px 30px;position:relative;z-index:1}
.shop-item{background:linear-gradient(145deg,rgba(30,20,60,.95),rgba(20,12,44,.95));border:2px solid #3d2d70;border-radius:var(--shape);padding:14px 12px;text-align:center;position:relative;overflow:hidden;transition:all .3s}
.shop-item.owned{border-color:#10b981;box-shadow:0 0 20px rgba(16,185,129,.4)}
.shop-item.equipped{border-color:var(--accent);box-shadow:0 0 30px var(--accent-glow)}
.shop-item-preview{width:100%;height:70px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:34px;border:2px solid rgba(255,255,255,.1);overflow:hidden;position:relative}
.shop-item-name{font-size:12px;font-weight:900;color:#fff;margin-bottom:3px;line-height:1.2}
.shop-item-desc{font-size:10px;color:#a78bfa;line-height:1.3;margin-bottom:8px;min-height:26px}
.shop-item-price{font-size:13px;font-weight:900;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:4px}
.shop-item-btn{width:100%;padding:8px;border-radius:14px;border:none;font-weight:900;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:all .2s}
.shop-item-btn.buy{background:linear-gradient(145deg,var(--accent),#f59e0b);color:#0a0a14}
.shop-item-btn.equip{background:linear-gradient(145deg,rgba(30,20,60,.9),rgba(20,12,44,.9));border:2px solid var(--accent);color:var(--accent)}
.shop-item-btn.equipped{background:linear-gradient(145deg,#10b981,#0891b2);color:#fff}
.shop-item-btn:disabled{opacity:.5;cursor:not-allowed}
.shop-item-badge{position:absolute;top:6px;right:6px;font-size:9px;padding:3px 8px;border-radius:8px;font-weight:900;letter-spacing:1px;z-index:3}
.shop-item-badge.owned{background:#10b981;color:#fff}
.shop-item-badge.equipped{background:var(--accent);color:#0a0a14}

.game-screen{background:#0a0a14;position:relative;z-index:1}
.top-bar{display:flex;align-items:center;padding:10px 14px;gap:10px;background:linear-gradient(180deg,rgba(30,20,60,.95),rgba(10,10,20,.9));border-bottom:1px solid #3d2d70;flex-shrink:0;z-index:100;position:relative}
.top-bar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.back-btn{padding:9px 20px;background:linear-gradient(145deg,#3d2d70,#2a1e4d);color:#fff;border:none;border-radius:22px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .25s}
.back-btn:active{transform:scale(.93);background:linear-gradient(145deg,var(--accent),#f59e0b);color:#0a0a14;box-shadow:0 0 20px var(--accent-glow)}
.game-title{flex:1;text-align:center;font-size:16px;font-weight:900;color:var(--accent);letter-spacing:.5px}
.bal-mini{background:#1a1432;border:1px solid var(--accent);border-radius:16px;padding:6px 14px;font-size:12px;font-weight:900;color:var(--accent);box-shadow:0 0 12px var(--accent-dim)}
.scroll-content{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:20px 20px 70px;gap:12px;height:0;min-height:0;position:relative;z-index:1}

.settings-card,.about-block,.shop-card,.bonus-card{width:100%;max-width:400px;background:linear-gradient(145deg,rgba(30,20,60,.95),rgba(20,12,44,.95));border:2px solid #3d2d70;border-radius:var(--shape);padding:20px;margin-bottom:12px;position:relative;overflow:visible;display:flex;flex-direction:column;gap:12px}
.settings-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#ffd700,var(--accent));border-radius:3px 0 0 3px}
.settings-title{font-size:14px;color:var(--accent);font-weight:900;letter-spacing:1px;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}
.settings-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--accent-dim),transparent);margin-top:8px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;gap:10px;flex-wrap:wrap}
.settings-row:last-child{border-bottom:none;padding-bottom:0}
.toggle-btn{padding:8px 20px;border-radius:16px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;transition:all .25s;letter-spacing:1px;flex-shrink:0}
.toggle-btn:active{transform:scale(.95)}
.toggle-btn.off{border-color:#666;color:#888}

.about-card{width:100%;max-width:400px;background:linear-gradient(145deg,rgba(30,20,60,.95),rgba(20,12,44,.95));border:2px solid var(--accent);border-radius:var(--shape);padding:28px 22px;margin-bottom:14px;text-align:center;box-shadow:0 0 40px var(--accent-dim)}
.about-icon{font-size:70px;margin-bottom:10px;filter:drop-shadow(0 0 15px var(--accent-glow))}
.about-card h2{font-size:28px;letter-spacing:3px;background:linear-gradient(90deg,#ffd700,var(--accent),#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.about-version{font-size:11px;color:#a78bfa;margin-top:4px}
.about-love{font-size:11px;color:var(--accent);margin-top:8px;font-style:italic}
.about-block h3{font-size:14px;color:var(--accent);margin:0;letter-spacing:1px;text-transform:uppercase}
.about-block p{font-size:13px;color:#cbd5e1;line-height:1.6;margin:0}

.name-input{width:100%;padding:14px 18px;background:rgba(26,16,53,.9);border:2px solid #3d2d70;border-radius:var(--shape);font-size:16px;font-weight:bold;color:#fff;outline:none;font-family:inherit;transition:all .3s}
.name-input:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent-dim)}
.name-input.p1{border-color:var(--accent)}
.name-input.p2{border-color:#10b981}

.bj-mode-btn{width:100%;max-width:360px;padding:18px 20px;background:linear-gradient(145deg,rgba(30,20,60,.9),rgba(20,12,44,.9));border:2px solid #3d2d70;border-radius:var(--shape);font-size:16px;font-weight:bold;color:#fff;display:flex;align-items:center;gap:16px;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:all .3s}
.bj-mode-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#ffd700,var(--accent))}
.bj-mode-btn:active{transform:scale(.965);border-color:var(--accent);box-shadow:0 0 25px var(--accent-dim)}
.bj-mode-btn .ico{font-size:34px;filter:drop-shadow(0 0 8px var(--accent-dim))}
.bj-mode-btn .info{flex:1;text-align:left}
.bj-mode-btn .info .n{font-size:15px;font-weight:900}
.bj-mode-btn .info .d{font-size:11px;color:#a78bfa;font-weight:normal;margin-top:3px}

.btn-deal{background:linear-gradient(145deg,var(--accent),#f59e0b);color:#0a0a14;padding:15px 40px;font-size:16px;border-radius:30px;border:none;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 0 25px var(--accent-glow),inset 0 -3px 0 rgba(0,0,0,.15);transition:all .2s;letter-spacing:.5px;position:relative;overflow:hidden}
.btn-deal:active{transform:scale(.95)}
.btn-deal:disabled{background:#444;color:#888;cursor:not-allowed;box-shadow:none}
.btn-deal.green{background:linear-gradient(145deg,#10b981,#0891b2);color:#fff}
.btn-deal.purple{background:linear-gradient(145deg,#a855f7,#8b5cf6);color:#fff}
.btn-deal.red{background:linear-gradient(145deg,#ff5252,#c62828);color:#fff}

.modal-overlay{position:fixed;inset:0;background:rgba(5,5,10,.85);backdrop-filter:blur(8px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:340px;background:linear-gradient(145deg,#1a1432,#0a0a14);border:2px solid var(--accent);border-radius:var(--shape);padding:28px 24px;text-align:center;box-shadow:0 0 60px var(--accent-glow);position:relative;animation:modalIn .4s cubic-bezier(.2,.7,.3,1.2)}
@keyframes modalIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:1px solid var(--accent-dim);border-radius:var(--shape);pointer-events:none}
.modal h3{font-size:19px;color:var(--accent);margin-bottom:8px;letter-spacing:1px}
.modal p{font-size:12px;color:#a78bfa;margin-bottom:12px;line-height:1.5}
.modal input{width:100%;padding:14px 18px;background:rgba(10,10,20,.9);border:2px solid #3d2d70;border-radius:14px;color:#fff;font-size:18px;font-weight:bold;text-align:center;letter-spacing:6px;outline:none;font-family:inherit;margin-bottom:10px;transition:all .3s}
.modal input:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent-dim)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions button{flex:1;padding:13px 0;border-radius:20px;border:none;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .2s}
.modal-actions button:active{transform:scale(.95)}
.modal-actions .m-cancel{background:transparent;color:#aaa;border:2px solid #3d2d70}
.modal-actions .m-ok{background:linear-gradient(145deg,var(--accent),#f59e0b);color:#0a0a14;box-shadow:0 0 20px var(--accent-dim)}

.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-30px) scale(.85);background:linear-gradient(145deg,var(--accent-glow),rgba(245,158,11,.98));color:#0a0a14;padding:14px 28px;border-radius:26px;font-weight:900;font-size:14px;z-index:200;display:none;max-width:90vw;text-align:center;border:2px solid #fff;box-shadow:0 8px 30px var(--accent-glow);opacity:0;transition:opacity .4s ease,transform .5s ease}
.toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.confetti{position:absolute;width:10px;height:10px;opacity:0;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-100vh) rotate(0)}100%{opacity:.8;transform:translateY(100vh) rotate(720deg)}}
.coin-fly{position:fixed;font-size:38px;pointer-events:none;z-index:160;animation:coinFly 1.2s ease-out forwards}
@keyframes coinFly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),-150px) scale(1.5);opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,var(--accent),transparent 70%);pointer-events:none;opacity:0;z-index:145}
.flash.flash-in{animation:flashIn .6s ease-out}
@keyframes flashIn{0%{opacity:.9}100%{opacity:0}}

.bet-item{background:rgba(26,16,53,.9);border-radius:18px 6px 18px 6px;padding:8px 12px;border:1px solid #3d2d70;display:flex;align-items:center;gap:6px;position:relative}
.bet-item.locked{opacity:.4;pointer-events:none}
.bet-item.p1{border-color:var(--accent);box-shadow:0 0 12px var(--accent-dim)}
.bet-item.p2{border-color:#10b981;box-shadow:0 0 12px rgba(16,185,129,.3)}
.bet-item .lbl{font-size:11px;color:#a78bfa;font-weight:bold;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-item.p1 .lbl{color:var(--accent)}
.bet-item.p2 .lbl{color:#10b981}
.bet-item button{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#3d2d70,#2a1e4d);color:#fff;border:none;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s}
.bet-item button:active{transform:scale(.9);background:var(--accent);color:#0a0a14}
.bet-item input.bet-input{width:64px;height:30px;background:transparent;border:1px solid #3d2d70;border-radius:8px;color:var(--accent);font-size:13px;font-weight:bold;text-align:center;outline:none;padding:0 4px}
.bet-opt{padding:10px 16px;border-radius:22px;border:2px solid #3d2d70;background:#1a1432;color:#fff;font-size:13px;font-weight:bold;cursor:pointer;transition:all .25s;font-family:inherit}
.bet-opt.active{border-color:var(--accent);background:linear-gradient(145deg,var(--accent-dim),rgba(245,158,11,.15));box-shadow:0 0 18px var(--accent-glow);color:#fff}
.msg-bar{text-align:center;font-size:13px;font-weight:bold;padding:10px;min-height:38px;border-radius:14px 4px 14px 4px;background:rgba(20,12,44,.9);display:flex;align-items:center;justify-content:center;border:1px solid var(--accent-dim)}
.msg-bar.info{color:var(--accent)}
.msg-bar.win{color:#10b981}
.msg-bar.lose{color:#ff5252}

/* KENO */
.keno-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px;overflow-y:auto;position:relative;z-index:1}
.keno-ball-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;perspective:900px}
.keno-ball-glow{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow),transparent 65%);opacity:0;transition:opacity .4s;pointer-events:none}
.keno-ball-glow.active{opacity:1;animation:glowPulse 1.5s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.2);opacity:1}}
.keno-ball{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff 0%,#ffe066 6%,var(--accent) 32%,#8b6914 72%,#4a3a0a 100%);position:relative;box-shadow:inset -20px -20px 40px rgba(0,0,0,.6),inset 15px 15px 30px rgba(255,255,255,.35),0 30px 60px rgba(0,0,0,.6),0 0 50px var(--accent-glow);transition:transform .15s ease;z-index:2}
.keno-ball::before{content:'';position:absolute;top:20%;left:26%;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),transparent 70%);filter:blur(3px)}
.keno-ball-number{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#f5f5f5 40%,#d4d4d4);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#1a1a1a;box-shadow:inset -3px -3px 8px rgba(0,0,0,.3),inset 2px 2px 6px rgba(255,255,255,.9),0 5px 12px rgba(0,0,0,.5);z-index:3;font-family:inherit}
.keno-ball.shaking{animation:ballShake .12s linear infinite}
@keyframes ballShake{0%{transform:translate(0,0) rotate(0deg) scale(1)}20%{transform:translate(-5px,4px) rotate(-4deg) scale(1.03)}40%{transform:translate(5px,-4px) rotate(4deg) scale(1.01)}60%{transform:translate(-4px,-5px) rotate(-3deg) scale(1.04)}80%{transform:translate(4px,5px) rotate(3deg) scale(1.02)}100%{transform:translate(-3px,4px) rotate(-2deg) scale(1.03)}}
.keno-ball.win-pop{animation:ballWinPop .9s cubic-bezier(.34,1.56,.64,1)}
@keyframes ballWinPop{0%{transform:scale(1)}30%{transform:scale(1.45) rotate(10deg)}60%{transform:scale(.92) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}
.keno-ball.lose-shake{animation:ballLose .5s ease-in-out}
@keyframes ballLose{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px) rotate(-5deg)}75%{transform:translateX(12px) rotate(5deg)}}
.keno-status{font-size:16px;font-weight:900;color:var(--accent);text-align:center;min-height:26px;letter-spacing:.5px;transition:all .3s}
.keno-status.shaking{color:#ffd700;animation:textPulse .5s ease-in-out infinite alternate}
@keyframes textPulse{from{opacity:.6;transform:scale(.98)}to{opacity:1;transform:scale(1.02)}}
.keno-status.win{color:#10b981;font-size:20px;text-shadow:0 0 20px rgba(16,185,129,.6)}
.keno-status.lose{color:#ff5252}
.keno-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:440px;margin-top:8px}
.keno-num{aspect-ratio:1/1;background:linear-gradient(145deg,#1e1a3a,#12102a);border:2px solid #3d2d70;border-radius:var(--shape);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.keno-num.selected{background:linear-gradient(145deg,var(--accent),#f59e0b);border-color:#ffd700;color:#0a0a14;box-shadow:0 0 30px var(--accent-glow),inset 0 -3px 0 rgba(0,0,0,.2);transform:scale(1.08) translateY(-3px)}
.keno-num.winning{background:linear-gradient(145deg,#10b981,#0891b2);border-color:#10b981;color:#fff;box-shadow:0 0 35px rgba(16,185,129,1),inset 0 -3px 0 rgba(0,0,0,.2);animation:winnerPop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes winnerPop{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.3) rotate(10deg)}70%{transform:scale(.95) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}
.keno-num.locked{cursor:not-allowed;opacity:.6}
.keno-bet-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.keno-hint{font-size:11px;color:#a78bfa;text-align:center;max-width:340px;line-height:1.5;padding:0 12px}

.reel-window{width:74px;height:96px;background:#0a0a14;border-radius:12px;overflow:hidden;position:relative;border:2px solid #3d2d70}
.reel-window::before,.reel-window::after{content:'';position:absolute;left:0;right:0;height:20px;pointer-events:none;z-index:5}
.reel-window::before{top:0;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent)}
.reel-window::after{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}
.reel-window.spinning{border-color:var(--accent);box-shadow:0 0 22px var(--accent-glow)}
.reel-strip-3d{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;will-change:transform}
.reel-cell-3d{width:100%;height:96px;display:flex;align-items:center;justify-content:center;font-size:48px;flex-shrink:0}
.slots-machine-3d{position:relative;padding:26px 22px;border-radius:28px;background:linear-gradient(160deg,#2a1a4a,#1a0e2e,#0a0618);border:3px solid var(--accent);box-shadow:0 20px 60px var(--accent-dim)}
.slots-machine-3d.spinning-machine{animation:machineShake .35s linear infinite}
@keyframes machineShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
.slots-reels-3d{display:flex;gap:10px;background:linear-gradient(180deg,#0a0a14,#050208);padding:16px;border-radius:20px;box-shadow:inset 0 8px 30px rgba(0,0,0,.9)}
.slots-payline{position:absolute;top:50%;left:22px;right:22px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),#10b981,var(--accent),transparent);transform:translateY(-50%);z-index:6;box-shadow:0 0 15px var(--accent)}
.slots-lights{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:space-around;padding:0 20px}
.slots-lights span{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:lightBlink 1s ease-in-out infinite alternate}
.slots-lights span:nth-child(2n){background:#10b981;box-shadow:0 0 12px #10b981}
.slots-lights span:nth-child(3n){background:#a855f7;box-shadow:0 0 12px #a855f7}
@keyframes lightBlink{from{opacity:.4;transform:scale(.85)}to{opacity:1;transform:scale(1.1)}}
.slots-3d-stage{perspective:1200px;display:flex;justify-content:center;align-items:center;padding:20px 0;width:100%}

.mines-grid,.lucky-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%;max-width:460px;aspect-ratio:1/1;margin:0 auto}
.mine-cell,.lucky-cell{background:linear-gradient(145deg,#1e2a4a,#16213e);border:2px solid #2d4070;border-radius:var(--shape);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:var(--accent);cursor:pointer;transition:all .35s ease}
.mine-cell.safe,.lucky-cell.win{background:linear-gradient(145deg,#10b981,#0891b2)!important;border-color:#10b981!important;color:#fff;box-shadow:0 0 30px #10b981}
.mine-cell.bomb{background:linear-gradient(145deg,#b71c1c,#7f0000)!important;border-color:#ff5252!important}
.mine-cell.opened,.lucky-cell.p1-open,.lucky-cell.p2-open{cursor:default;opacity:.55}

.dice-3d-stage{perspective:1200px;display:flex;gap:50px;justify-content:center;align-items:center;padding:40px 20px;min-height:200px}
.die-3d{width:90px;height:90px;position:relative;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.2,.7,.3,1.2)}
.die-3d .face{position:absolute;width:90px;height:90px;background:linear-gradient(145deg,#ffffff,#e8e8e8);border:2px solid #999;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 20px rgba(0,0,0,.15);backface-visibility:hidden}
.die-3d .face .pip{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#1a1a1a);position:absolute}
.die-3d .face[data-face="1"] .pip{top:50%;left:50%;transform:translate(-50%,-50%)}
.die-3d .face[data-face="2"] .pip:nth-child(1){top:20%;left:20%}
.die-3d .face[data-face="2"] .pip:nth-child(2){bottom:20%;right:20%}
.die-3d .face[data-face="3"] .pip:nth-child(1){top:20%;left:20%}
.die-3d .face[data-face="3"] .pip:nth-child(2){top:50%;left:50%;transform:translate(-50%,-50%)}
.die-3d .face[data-face="3"] .pip:nth-child(3){bottom:20%;right:20%}
.die-3d .face[data-face="4"] .pip:nth-child(1){top:20%;left:20%}
.die-3d .face[data-face="4"] .pip:nth-child(2){top:20%;right:20%}
.die-3d .face[data-face="4"] .pip:nth-child(3){bottom:20%;left:20%}
.die-3d .face[data-face="4"] .pip:nth-child(4){bottom:20%;right:20%}
.die-3d .face[data-face="5"] .pip:nth-child(1){top:20%;left:20%}
.die-3d .face[data-face="5"] .pip:nth-child(2){top:20%;right:20%}
.die-3d .face[data-face="5"] .pip:nth-child(3){top:50%;left:50%;transform:translate(-50%,-50%)}
.die-3d .face[data-face="5"] .pip:nth-child(4){bottom:20%;left:20%}
.die-3d .face[data-face="5"] .pip:nth-child(5){bottom:20%;right:20%}
.die-3d .face[data-face="6"] .pip:nth-child(1){top:20%;left:20%}
